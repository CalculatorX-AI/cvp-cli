name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  replay:
    # Ubuntu 26.04 has no Python 3.9 build in setup-python's catalog.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: cvp --version
      - name: Check the release tag matches the installed CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(cvp --version)"
  published-packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download and replay pinned releases
        run: python -B -m scripts.verify_releases
